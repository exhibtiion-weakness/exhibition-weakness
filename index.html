<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>exhibition-weakness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: 0, 0, 0;
    --ink: #fff;
    --muted: rgba(255,255,255,.7);
    --accent: #5ea75e;
    --bg: #14181c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1013; } }
  :root[data-theme="dark"] { --bg: #0d1013; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #panel {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-width: 640px; margin: 0 auto; height: 52%;
    display: flex; flex-direction: column;
    background: rgba(var(--panel), .5);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-radius: 16px; overflow: hidden;
  }
  #text { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 18px 24px; line-height: 1.85; font-size: 16px; }
  #text h1 { font-size: 20px; margin: 4px 0 12px; }
  #text p { margin: 0 0 1em; }
  body.nocam #panel { height: calc(100% - 24px - env(safe-area-inset-bottom, 0px) - 56px); top: 56px; bottom: auto; }
  body.nocam { background: linear-gradient(160deg, #1d2a33, #0d1013); }
  #retry { display: none; margin: 8px auto 0; background: none; border: 1px solid var(--muted); color: var(--ink);
    border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 13px; }
  body.nocam #retry { display: block; }
  #text .name { font-size: 13px; color: var(--accent); margin: 0 0 4px; letter-spacing: .08em; }
  #text .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #text .chips a { color: var(--ink); border: 1px solid var(--muted); border-radius: 999px; padding: 4px 14px;
    text-decoration: none; font-size: 14px; }
  #text .chips a[aria-current="true"] { background: var(--accent); color: #0d1013; border-color: var(--accent); }
  #text .chips a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #msg { z-index: 2; position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; text-align: center;
    font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="msg">カメラを起動しています…<button id="retry" type="button">カメラを再試行</button></div>

<section id="panel" aria-label="説明テキスト">
  <div id="text" tabindex="0"><p>読み込み中…</p></div>
</section>

<script>
  var cam = document.getElementById("cam"), msg = document.getElementById("msg");
  var panel = document.getElementById("panel");


  function fail(text) {
    document.body.classList.add("nocam");
    msg.firstChild.nodeValue = text;
    msg.style.display = "block";
  }
  function start() {
    document.body.classList.remove("nocam");
    msg.firstChild.nodeValue = "カメラを起動しています…";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      fail("カメラを使えない環境です。文章だけ表示しています。標準ブラウザ(Safari / Chrome)で開き直すとカメラが使えます。");
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then(function (stream) {
        cam.srcObject = stream;
        msg.style.display = "none";
      })
      .catch(function () {
        fail("カメラが許可されていないため、文章だけ表示しています。許可すると背景にカメラが映ります。");
      });
  }
  document.getElementById("retry").addEventListener("click", start);
  start();

  // ---- 作品の表示(works.json を読み込み、?w=番号 で切り替え) ----
  var textBox = document.getElementById("text");
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function render(works) {
    var id = new URLSearchParams(location.search).get("w");
    var cur = null;
    for (var i = 0; i < works.length; i++) if (works[i].id === id) cur = works[i];
    textBox.textContent = "";
    if (cur) {
      document.title = cur.title + " / " + cur.name;
      textBox.appendChild(el("p", cur.title, "name"));
      textBox.appendChild(el("h1", cur.name));
      cur.body.forEach(function (t) { textBox.appendChild(el("p", t)); });
    } else {
      textBox.appendChild(el("h1", "作品一覧"));
      textBox.appendChild(el("p", id ? "指定された作品が見つかりませんでした。下から選んでください。" : "見たい作品を選んでください。"));
    }
    textBox.appendChild(el("p", "ほかの作品", "name"));
    var chips = el("div", null, "chips");
    works.forEach(function (w) {
      var a = el("a", w.id);
      a.href = "?w=" + encodeURIComponent(w.id);
      a.setAttribute("aria-label", w.title + " " + w.name);
      if (cur && cur.id === w.id) a.setAttribute("aria-current", "true");
      chips.appendChild(a);
    });
    textBox.appendChild(chips);
  }
  fetch("works.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { render(d.works); })
    .catch(function () { textBox.textContent = "解説を読み込めませんでした。時間をおいて開き直してください。"; });
</script>
</body>
</html>
